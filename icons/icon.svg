<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- Page/document (white, with subtle shadow) -->
  <rect x="38" y="24" width="52" height="80" rx="4" fill="white" opacity="0.95"/>

  <!-- Page content lines (representing text) -->
  <rect x="46" y="36" width="28" height="4" rx="2" fill="#667eea" opacity="0.4"/>
  <rect x="46" y="46" width="36" height="4" rx="2" fill="#667eea" opacity="0.3"/>
  <rect x="46" y="56" width="32" height="4" rx="2" fill="#667eea" opacity="0.3"/>
  <rect x="46" y="66" width="36" height="4" rx="2" fill="#667eea" opacity="0.3"/>
  <rect x="46" y="76" width="24" height="4" rx="2" fill="#667eea" opacity="0.3"/>
  <rect x="46" y="86" width="30" height="4" rx="2" fill="#667eea" opacity="0.4"/>

  <!-- Capture corners (screenshot indicator) -->
  <!-- Top left -->
  <path d="M28 38 L28 28 L38 28" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Top right -->
  <path d="M100 28 L90 28 L90 28 M100 28 L100 38" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Bottom left -->
