  <!-- Bottom right -->
  <path d="M100 100 L90 100 M100 100 L100 90" stroke="white" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Scroll indicator (arrow pointing down) -->
  <circle cx="96" cy="64" r="12" fill="white" opacity="0.95"/>
  <path d="M96 58 L96 70 M90 65 L96 71 L102 65" stroke="#764ba2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
