<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- Camera body -->
  <rect x="32" y="48" width="64" height="44" rx="6" fill="white" opacity="0.95"/>

  <!-- Camera lens -->
  <circle cx="64" cy="70" r="16" fill="#667eea"/>
  <circle cx="64" cy="70" r="12" fill="#764ba2"/>
  <circle cx="64" cy="70" r="6" fill="white" opacity="0.5"/>

  <!-- Flash -->
  <rect x="80" y="52" width="8" height="8" rx="2" fill="white" opacity="0.95"/>

  <!-- Viewfinder -->
  <rect x="40" y="52" width="14" height="8" rx="2" fill="#667eea" opacity="0.7"/>

  <!-- Decorative dots -->
  <circle cx="64" cy="38" r="3" fill="white" opacity="0.8"/>
  <circle cx="54" cy="38" r="2" fill="white" opacity="0.6"/>
  <circle cx="74" cy="38" r="2" fill="white" opacity="0.6"/>
</svg>
