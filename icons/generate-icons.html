<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    .icon-set {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      align-items: flex-end;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <h1>FullPageShot Icon Generator</h1>
  <p>Click the button below to generate and download all icon sizes.</p>
  <button onclick="generateIcons()">Generate Icons</button>

  <div class="icon-set">
    <div>
      <h3>16x16</h3>
      <canvas id="canvas16" width="16" height="16"></canvas>
    </div>
    <div>
      <h3>48x48</h3>
      <canvas id="canvas48" width="48" height="48"></canvas>
    </div>
    <div>
      <h3>128x128</h3>
      <canvas id="canvas128" width="128" height="128"></canvas>
    </div>
  </div>

  <script>
    function drawIcon(ctx, size) {
      // Clear canvas
      ctx.clearRect(0, 0, size, size);

      // Scale factor
      const s = size / 128;

      // Background circle with gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(64 * s, 64 * s, 60 * s, 0, 2 * Math.PI);
      ctx.fill();

      // Page/document
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.roundRect(38 * s, 24 * s, 52 * s, 80 * s, 4 * s);
      ctx.fill();

      // Page content lines
      const lines = [
        { y: 36, w: 28, opacity: 0.4 },
        { y: 46, w: 36, opacity: 0.3 },
        { y: 56, w: 32, opacity: 0.3 },
        { y: 66, w: 36, opacity: 0.3 },
        { y: 76, w: 24, opacity: 0.3 },
        { y: 86, w: 30, opacity: 0.4 }
      ];

      lines.forEach(line => {
        ctx.fillStyle = `rgba(102, 126, 234, ${line.opacity})`;
        ctx.beginPath();
        ctx.roundRect(46 * s, line.y * s, line.w * s, 4 * s, 2 * s);
        ctx.fill();
      });

      // Capture corners
      ctx.strokeStyle = 'white';
      ctx.lineWidth = 4 * s;
      ctx.lineCap = 'round';

      // Top left
      ctx.beginPath();
      ctx.moveTo(28 * s, 38 * s);
      ctx.lineTo(28 * s, 28 * s);
      ctx.lineTo(38 * s, 28 * s);
      ctx.stroke();

      // Top right
      ctx.beginPath();
      ctx.moveTo(90 * s, 28 * s);
      ctx.lineTo(100 * s, 28 * s);
      ctx.lineTo(100 * s, 38 * s);
      ctx.stroke();

      // Bottom left
      ctx.beginPath();
      ctx.moveTo(28 * s, 90 * s);
      ctx.lineTo(28 * s, 100 * s);
      ctx.lineTo(38 * s, 100 * s);
      ctx.stroke();

      // Bottom right
      ctx.beginPath();
      ctx.moveTo(90 * s, 100 * s);
      ctx.lineTo(100 * s, 100 * s);
      ctx.lineTo(100 * s, 90 * s);
      ctx.stroke();

      // Scroll indicator circle
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.arc(96 * s, 64 * s, 12 * s, 0, 2 * Math.PI);
      ctx.fill();

      // Scroll arrow
      ctx.strokeStyle = '#764ba2';
      ctx.lineWidth = 3 * s;
      ctx.lineJoin = 'round';

      // Arrow line
      ctx.beginPath();
      ctx.moveTo(96 * s, 58 * s);
      ctx.lineTo(96 * s, 70 * s);
      ctx.stroke();

      // Arrow head
      ctx.beginPath();
      ctx.moveTo(90 * s, 65 * s);
      ctx.lineTo(96 * s, 71 * s);
      ctx.lineTo(102 * s, 65 * s);
      ctx.stroke();
    }

    function generateIcons() {
      const sizes = [16, 48, 128];

      sizes.forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');

        drawIcon(ctx, size);

        // Download the icon
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `icon${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });

      alert('Icons generated! Move the downloaded files to the icons folder.');
    }

    // Draw icons on page load
    window.onload = () => {
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');
        drawIcon(ctx, size);
      });
    };
  </script>
</body>
</html>
