<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    canvas {
      border: 1px solid #ccc;
      margin: 10px;
    }
    .icon-set {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background: #5568d3;
    }
  </style>
</head>
<body>
  <h1>FullPageShot Icon Generator</h1>
  <p>Click the button below to generate and download all icon sizes.</p>
  <button onclick="generateIcons()">Generate Icons</button>

  <div class="icon-set">
    <div>
      <h3>16x16</h3>
      <canvas id="canvas16" width="16" height="16"></canvas>
    </div>
    <div>
      <h3>48x48</h3>
      <canvas id="canvas48" width="48" height="48"></canvas>
    </div>
    <div>
      <h3>128x128</h3>
      <canvas id="canvas128" width="128" height="128"></canvas>
    </div>
  </div>

  <script>
    function drawIcon(ctx, size) {
      // Clear canvas
      ctx.clearRect(0, 0, size, size);

      // Scale factor
      const scale = size / 128;

      // Background circle with gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2.13, 0, 2 * Math.PI);
      ctx.fill();

      // Camera body
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.roundRect(32 * scale, 48 * scale, 64 * scale, 44 * scale, 6 * scale);
      ctx.fill();

      // Camera lens outer
      ctx.fillStyle = '#667eea';
      ctx.beginPath();
      ctx.arc(64 * scale, 70 * scale, 16 * scale, 0, 2 * Math.PI);
      ctx.fill();

      // Camera lens middle
      ctx.fillStyle = '#764ba2';
      ctx.beginPath();
      ctx.arc(64 * scale, 70 * scale, 12 * scale, 0, 2 * Math.PI);
      ctx.fill();

      // Camera lens inner
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      ctx.arc(64 * scale, 70 * scale, 6 * scale, 0, 2 * Math.PI);
      ctx.fill();

      // Flash
      ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
      ctx.beginPath();
      ctx.roundRect(80 * scale, 52 * scale, 8 * scale, 8 * scale, 2 * scale);
      ctx.fill();

      // Viewfinder
      ctx.fillStyle = 'rgba(102, 126, 234, 0.7)';
      ctx.beginPath();
      ctx.roundRect(40 * scale, 52 * scale, 14 * scale, 8 * scale, 2 * scale);
      ctx.fill();
    }

    function generateIcons() {
      const sizes = [16, 48, 128];

      sizes.forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');

        drawIcon(ctx, size);

        // Download the icon
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `icon${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });

      alert('Icons generated! Check your downloads folder.');
    }

    // Draw icons on page load
    window.onload = () => {
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById(`canvas${size}`);
        const ctx = canvas.getContext('2d');
        drawIcon(ctx, size);
      });
    };
  </script>
</body>
</html>
