<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FullPageShot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>FullPageShot</h1>
    <p class="subtitle">Capture full-page screenshots</p>

    <div class="button-group">
      <button id="captureImage" class="capture-btn image-btn">
        <span class="icon">📷</span>
        <span class="text">Save as Image</span>
      </button>

      <button id="capturePDF" class="capture-btn pdf-btn">
        <span class="icon">📄</span>
        <span class="text">Save as PDF</span>
      </button>
    </div>

    <div class="options">
      <label class="toggle-option">
        <input type="checkbox" id="hideStickyElements" checked>
        <span class="toggle-slider"></span>
        <span class="toggle-label">Hide sticky menus</span>
      </label>
      <p class="option-description">Remove fixed headers/footers from middle captures</p>

      <label class="toggle-option" style="margin-top: 12px;">
        <input type="checkbox" id="showUrlHeader">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Show URL header</span>
      </label>
      <p class="option-description">Add page URL above the screenshot</p>

      <label class="toggle-option" style="margin-top: 12px;">
        <input type="checkbox" id="limitCapture">
        <span class="toggle-slider"></span>
        <span class="toggle-label">Limit capture length</span>
      </label>
      <div id="maxCapturesRow" class="max-captures-row hidden">
        <label for="maxCaptures" class="max-captures-label">Max screens:</label>
        <input type="number" id="maxCaptures" class="max-captures-input" min="1" max="99" value="3">
      </div>
      <p class="option-description">Cap screenshots for infinite-scroll pages</p>
    </div>

    <div id="status" class="status hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
